<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>silver features</title>
<meta name="description" content="silver is a native, LLVM-backed systems language with live reload, a git-native import system that builds any dependency's own build system, and zero-binding C/C++ interop. MIT licensed, 8 years in development.">
<meta property="og:title" content="silver — a native build language">
<meta property="og:description" content="LLVM-backed systems language with live reload, git-native imports, and zero-binding C/C++ interop. MIT, self-hosting, in development since 2017.">
<meta property="og:type" content="website">
<link rel="icon" href="silver-icon.png">
<style>
  :root {
    --bg:#0b0d10; --bg2:#111419; --panel:#14181e; --line:#222831;
    --fg:#e7ecf2; --mut:#97a3b2; --dim:#6c7787;
    --ag:#c9d4e3;            /* silver text */
    --acc:#7fb0ff; --acc2:#9b8cff;
    --k:#7fb0ff; --t:#5fd6b5; --s:#e3b778; --c:#5c6675; --n:#d98ad1; --fn:#e7ecf2;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--sans); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:980px; margin:0 auto; padding:0 24px; }

  /* hero */
  header.hero {
    position:relative; overflow:hidden;
    padding:96px 0 64px;
    background:
      radial-gradient(1100px 500px at 70% -10%, rgba(127,176,255,.10), transparent 60%),
      radial-gradient(900px 500px at 10% 0%, rgba(155,140,255,.08), transparent 55%);
    border-bottom:1px solid var(--line);
  }
  .hero-bg {
    position:absolute; inset:0; z-index:0;
    background:url("silver-icon.png") no-repeat center right;
    background-size:cover; opacity:.9;
    transform:translateX(20%);
  }
  .hero-bg::after {
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(90deg, var(--bg) 3%, rgba(11,13,16,.62) 42%, rgba(11,13,16,0) 82%),
      linear-gradient(0deg, var(--bg) 1%, rgba(11,13,16,0) 38%),
      linear-gradient(180deg, var(--bg) 0%, rgba(11,13,16,0) 32%);
  }
  header.hero > .wrap { position:relative; z-index:1; }
  .hero-quote {
    position:absolute; top:0; right:0; z-index:3;
    white-space:nowrap;
    font-family:var(--mono); font-style:italic; font-size:14px; line-height:1.5;
    color:var(--ag);
    padding:12px 18px;
    background:linear-gradient(180deg, rgba(20,24,30,.62), rgba(14,18,24,.5));
    border:1px solid var(--line); border-right:2px solid var(--acc);
    border-radius:12px;
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    box-shadow:0 12px 32px rgba(0,0,0,.38);
  }
  .hero-quote b { color:#fff; font-style:normal; }
  .hero-quote::before { content:"\201C"; color:var(--acc); font-size:20px;
    vertical-align:-3px; margin-right:3px; opacity:.85; }
  .mark { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
  .mark img { width:54px; height:54px; border-radius:12px; }
  .wordmark {
    font-size:30px; font-weight:700; letter-spacing:-.5px;
    background:linear-gradient(180deg,#fff,#aab6c6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .wordmark span { font-family:var(--mono); font-weight:600; font-size:15px;
    -webkit-text-fill-color:var(--dim); margin-left:8px; }
  h1 {
    font-size:clamp(34px,5.4vw,56px); line-height:1.08; letter-spacing:-1.2px;
    margin:0 0 18px; font-weight:760; max-width:18ch;
  }
  h1 .g { background:linear-gradient(120deg,#cdd8e8,#7fb0ff 60%,#9b8cff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 .kw { font-family:var(--mono); color:var(--k); font-weight:600;
    font-size:.74em; background:var(--panel); border:1px solid var(--line);
    padding:.06em .34em; border-radius:8px; vertical-align:.06em; }
  .lede { font-size:19px; color:var(--mut); max-width:62ch; margin:0 0 30px;
    text-shadow:2px 2px 4px rgba(0,0,0,.7); }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
  .badge {
    font-family:var(--mono); font-size:12.5px; color:var(--ag);
    background:var(--panel); border:1px solid var(--line);
    padding:5px 11px; border-radius:999px;
  }
  .badge b { color:#fff; font-weight:600; }
  .cta { display:flex; flex-wrap:wrap; gap:12px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px;
    font-weight:600; font-size:15px; padding:12px 20px; border-radius:10px;
    border:1px solid var(--line);
  }
  .btn.primary { background:linear-gradient(180deg,#3b6fd4,#2f59b0); color:#fff; border-color:#3b6fd4; }
  .btn.primary:hover { text-decoration:none; filter:brightness(1.07); }
  .btn.ghost { background:var(--panel); color:var(--fg); }
  .btn.ghost:hover { text-decoration:none; border-color:#33404e; }

  /* sections */
  section { padding:72px 0; border-bottom:1px solid var(--line); }
  .eyebrow { font-family:var(--mono); font-size:12.5px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--acc); margin:0 0 10px; }
  h2 { font-size:clamp(26px,3.6vw,34px); letter-spacing:-.6px; margin:0 0 14px; }
  h2 code { color:var(--k); font-family:var(--mono); font-weight:600; font-size:.74em;
    background:var(--panel); border:1px solid var(--line); padding:.05em .32em; border-radius:8px; }
  .sub { color:var(--mut); font-size:17px; max-width:64ch; margin:0 0 36px; }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
  .trio { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:28px; }
  .card {
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line); border-radius:14px; padding:24px;
  }
  .card h3 { margin:0 0 8px; font-size:18px; letter-spacing:-.3px; }
  .card h3 .ic { color:var(--acc); font-family:var(--mono); margin-right:8px; }
  .card p { margin:0; color:var(--mut); font-size:15px; }

  /* code */
  .code {
    background:#0c0f13; border:1px solid var(--line); border-radius:14px;
    overflow:hidden; margin:0 0 20px;
  }
  .code .bar {
    display:flex; align-items:center; gap:8px; padding:11px 16px;
    border-bottom:1px solid var(--line); background:#0a0c10;
  }
  .code .bar .dot { width:11px; height:11px; border-radius:50%; background:#2a323d; }
  .code .bar .name { font-family:var(--mono); font-size:12.5px; color:var(--dim); margin-left:6px; }
  pre { margin:0; padding:20px 22px; overflow-x:auto; }
  code, pre { font-family:var(--mono); font-size:13.5px; line-height:1.7; }
  pre .k { color:var(--k); }    /* keyword */
  pre .t { color:var(--t); }    /* type */
  pre .s { color:var(--s); }    /* string */
  pre .c { color:var(--c); font-style:italic; }  /* comment */
  pre .n { color:var(--n); }    /* number */
  pre .f { color:var(--fn); }   /* function */
  pre .m { color:var(--mut); }  /* muted/punct */

  .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .two .txt h3 { font-size:20px; margin:0 0 10px; letter-spacing:-.3px; }
  .two .txt h3 code { font-size:1em; color:var(--k); }
  .two .txt p { color:var(--mut); margin:0 0 14px; font-size:15.5px; }

  /* built-with */
  .builtwith { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .bw {
    border:1px solid var(--line); border-radius:14px; padding:22px;
    background:linear-gradient(180deg,var(--panel),var(--bg2));
  }
  .bw h3 { margin:0 0 6px; font-size:18px; }
  .bw .tag { font-family:var(--mono); font-size:12px; color:var(--acc); }
  .bw p { color:var(--mut); font-size:14.5px; margin:8px 0 0; }

  /* stats strip */
  section.docker {
    background:
      radial-gradient(820px 380px at 80% 26%, rgba(127,176,255,.15), transparent 60%),
      linear-gradient(180deg,#0c1016,#0b0d10);
  }
  .whale { width:100%; max-width:400px; height:auto; display:block; margin:8px auto 0;
    filter:drop-shadow(0 16px 38px rgba(127,176,255,.22)); }
  .module { position:relative; width:100%; max-width:340px; margin:0 auto; }
  .module img { width:100%; display:block;
    filter:drop-shadow(0 18px 42px rgba(127,176,255,.34)); }
  .module-chips {
    position:absolute; left:11%; right:9%; top:35%; bottom:19%;
    display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; gap:7px;
  }
  .module-chips span {
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:13px; font-weight:600; color:#eaf3ff;
    background:rgba(8,16,28,.52); border:1px solid rgba(255,255,255,.45);
    border-radius:6px;
  }
  .plat-cap { font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--dim); margin:26px 0 10px; }
  .plats { display:flex; flex-wrap:wrap; gap:9px; }
  .plat { font-family:var(--mono); font-size:13px; color:var(--ag); background:var(--panel);
    border:1px solid var(--line); padding:7px 13px; border-radius:10px; }
  .plat b { color:#fff; font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; text-align:center; }
  .stat .num { font-size:34px; font-weight:730; letter-spacing:-1px;
    background:linear-gradient(180deg,#fff,#9fb0c4); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .stat .lab { color:var(--mut); font-size:13.5px; margin-top:4px; }

  footer { padding:54px 0 70px; color:var(--dim); font-size:14px; }
  footer .row { display:flex; flex-wrap:wrap; gap:18px 28px; align-items:center; justify-content:space-between; }
  footer a { color:var(--mut); }

  .more { margin-top:16px; display:inline-block; background:none; border:none; padding:0;
    cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:600; color:var(--acc); }
  .more:hover { text-decoration:underline; }
  dialog.sheet { inset:0; width:100%; height:100%; max-width:100%; max-height:100%;
    border:none; background:transparent; padding:0; }
  dialog.sheet[open] { display:grid; place-items:center; }
  dialog.sheet::backdrop { background:rgba(4,6,9,.66); backdrop-filter:blur(4px); }
  .sheet-in { position:relative; width:min(720px,92vw); max-height:86vh; overflow:auto;
    color:var(--fg);
    background:linear-gradient(180deg,var(--panel),var(--bg2)); border:1px solid var(--line);
    border-radius:16px; padding:32px 32px 36px; box-shadow:0 30px 90px rgba(0,0,0,.55); }
  .sheet-in code { color:var(--ag); }
  .sheet-x { position:absolute; top:10px; right:16px; background:none; border:none; cursor:pointer;
    color:var(--mut); font-size:26px; line-height:1; }
  .sheet-x:hover { color:#fff; }
  .sheet-in h3 { font-size:23px; letter-spacing:-.3px; margin:4px 0 14px; color:#fff; }
  .sheet-in h4 { font-size:15px; margin:22px 0 8px; color:#fff; }
  .sheet-in p { color:var(--mut); font-size:15px; margin:0 0 12px; }
  .sheet-in .code { margin:12px 0; }
  @media (max-width:720px){
    .grid,.two,.builtwith,.trio { grid-template-columns:1fr; }
    .hero-quote { position:static; white-space:normal; max-width:none; text-align:left; margin:0 0 24px;
      border-right:1px solid var(--line); border-left:2px solid var(--acc); }
    .stats { grid-template-columns:repeat(2,1fr); gap:28px 18px; }
    header.hero { padding:64px 0 48px; }
  }
  /* the features page */
  .two.feat { margin:0 0 8px; }
  .code.full { margin:0 0 20px; }
  .toc { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="mark">
      <div class="wordmark">silver <span>features</span></div>
    </div>
<!-- hero -->
  </div>
</header>

<!-- features -->

<footer>
  <div class="wrap">
    <div class="row">
      <div>silver — a native build language · MIT License · © 2017 Kalen Novis White</div>
      <div class="row" style="gap:18px;">
        <a href="https://github.com/ar-visions/silver">silver</a>
        <a href="https://github.com/ar-visions/orbiter">orbiter</a>
        <a href="https://github.com/ar-visions/hyperspace">hyperspace</a>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
